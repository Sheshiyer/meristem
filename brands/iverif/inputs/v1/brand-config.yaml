theme:
  name: Signal in the System
  description: A visual system built on precision, clarity, and trust. Where regulatory
    complexity meets AI elegance.
  metaphor: A high-precision instrument panel — every signal clear, every threshold
    visible, every action traceable.
  mood_keywords:
  - precision
  - clarity
  - trust
  - technical elegance
  - regulatory confidence
  - system intelligence
  - structured
  - verifiable
