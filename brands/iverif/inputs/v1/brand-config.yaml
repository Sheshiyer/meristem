- brushed aluminum
- matte black carbon fiber
- green LED indicator glass
- fine-grain stone paper
- surgical steel
- polished concrete
- circuit board traces
- frosted acrylic
photography:
  style: High-contrast editorial, clean lines, documentary precision
  environment: Modern office, regulatory desk, document workflow
  constraint: No generic stock photo faces. No gradient backgrounds. No cartoonish
    elements.
  camera: Sony A7 IV, 35mm f/1.4, neutral color profile
illustration:
  style: Technical diagram meets editorial illustration — precise linework with subtle
    depth
  references: Dieter Rams product photography meets Swiss International Style information
    graphics
sigil:
  description: A document icon with an integrated validation checkmark, formed by
    converging lines suggesting both paper and digital signal
  components:
  - document form
  - validation signal
  - digital precision
audience:
  persona_name: The Compliance Operator
  aesthetic_affinity: Clean, functional, no-frills professionalism. Values precision
    over decoration.
  aspirational_brands: Stripe, Notion, Vercel, Linear
  emotional_register: Confident control, regulatory peace of mind, operational pride
competitive_context:
  avoid_visual_patterns: Generic blue corporate SaaS, playful fintech colors, overly
    complex dashboard mockups
  differentiate_from: Legacy document management (DocuSign, SharePoint), generic OCR
    tools
  occupy_territory: Where regulatory precision meets AI intelligence — the intersection
    of compliance and automation
positioning:
  statement: The only AI validation platform built specifically for EU energy subsidy
    operators, with pre-configured programme rules and managed onboarding.
  hero_headline: Stop losing subsidy claims to avoidable document errors.
  identity_pillars:
  - Regulatory precision
  - AI intelligence
  - Managed expertise
  - EU-native compliance
products:
  hero:
    name: iverif.io Platform
    description: AI-powered document validation for energy subsidy dossiers — cross-check
      every field, every document, every programme rule before submission.
    physical_form: Web platform with API integration, white-label ready
  capsule_lineup:
  - name: Dossier Validation
    description: Full cross-document validation for any EU energy subsidy programme
  - name: Programme Configuration
    description: Managed setup for CEE, Conto Termico, BEG, ECO4, Primes Énergie,
      MOVES III
  - name: Audit Trail
    description: Complete timestamped logs of every validation check for regulatory
      compliance
  detail:
    name: Validation Engine
    focus: Real-time cross-document field extraction, rule checking, and inconsistency
      flagging with explainable AI output
  flatlay_objects:
    count: 6
    items:
    - printed CEE attestation
    - technical specification sheet
    - installation certificate
    - smartphone showing validation report
    - fine-tip pen on regulatory desk
    - EU flag pin
  category: Regulatory SaaS platform
