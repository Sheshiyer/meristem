  primary:
    name: Signal Green
    hex: '#2EE600'
    role: 60% — CTAs, validation indicators, primary actions, alive elements
  secondary:
    name: Regulatory Stone
    hex: '#1C1917'
    role: 30% — text, anchoring surfaces, authority
  accent:
    name: Clean White
    hex: '#FAFAF9'
    role: 10% — backgrounds, breathing room, contrast
